<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta
        name="description"
        content="Portal personal de accesos rápidos a herramientas clínicas y de trabajo."
    >
    <meta name="color-scheme" content="dark light">
    <title>Mi Portal Diario</title>

    <style>
        /* =========================================================
           VARIABLES
           ========================================================= */
        :root {
            --bg: #07101c;
            --bg-2: #0b1524;
            --surface: rgba(15, 27, 44, 0.88);
            --surface-solid: #0f1b2c;
            --surface-hover: #14253a;
            --surface-soft: rgba(255, 255, 255, 0.035);

            --text: #f5f7fb;
            --text-2: #a7b3c6;
            --text-3: #6f7f96;

            --line: rgba(148, 163, 184, 0.13);
            --line-strong: rgba(148, 163, 184, 0.24);

            --accent: #5eead4;
            --accent-2: #2dd4bf;
            --focus: rgba(45, 212, 191, 0.22);

            --shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.11);
            --shadow-hover: 0 14px 28px rgba(0, 0, 0, 0.2);

            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 9px;

            --font:
                Inter,
                ui-sans-serif,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            --general: #38bdf8;
            --general-rgb: 56, 189, 248;

            --cosam: #818cf8;
            --cosam-rgb: 129, 140, 248;

            --enlace: #2dd4bf;
            --enlace-rgb: 45, 212, 191;

            --vida: #34d399;
            --vida-rgb: 52, 211, 153;

            --gmail: #ea4335;
            --gmail-rgb: 234, 67, 53;

            --rayen: #3b82f6;
            --rayen-rgb: 59, 130, 246;
        }

        html[data-theme="light"] {
            --bg: #edf3f8;
            --bg-2: #e7eef5;
            --surface: rgba(255, 255, 255, 0.86);
            --surface-solid: #ffffff;
            --surface-hover: #f8fafc;
            --surface-soft: rgba(15, 23, 42, 0.025);

            --text: #102033;
            --text-2: #5f7187;
            --text-3: #8b9aae;

            --line: rgba(15, 23, 42, 0.09);
            --line-strong: rgba(15, 23, 42, 0.15);

            --accent: #0f8f83;
            --accent-2: #0f9f91;
            --focus: rgba(15, 159, 145, 0.14);

            --shadow: 0 12px 30px rgba(46, 62, 80, 0.08);
            --shadow-card: 0 7px 18px rgba(46, 62, 80, 0.055);
            --shadow-hover: 0 13px 25px rgba(46, 62, 80, 0.11);

            --general: #0284c7;
            --general-rgb: 2, 132, 199;

            --cosam: #4f46e5;
            --cosam-rgb: 79, 70, 229;

            --enlace: #0f8f83;
            --enlace-rgb: 15, 143, 131;

            --vida: #059669;
            --vida-rgb: 5, 150, 105;
        }

        /* =========================================================
           RESET
           ========================================================= */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-width: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-width: 100%;
            min-height: 100vh;
            font-family: var(--font);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;

            background:
                radial-gradient(circle at 10% -10%, rgba(56, 189, 248, 0.10), transparent 28rem),
                radial-gradient(circle at 92% 0%, rgba(45, 212, 191, 0.08), transparent 24rem),
                linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 58%);
        }

        button,
        input {
            font: inherit;
        }

        button {
            color: inherit;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================
           LAYOUT
           ========================================================= */
        .page {
            width: min(100%, 1480px);
            margin: 0 auto;
            padding:
                max(14px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
        }

        .shell {
            position: relative;
        }

        /* =========================================================
           HEADER
           ========================================================= */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 11px;
        }

        .brand-mark {
            position: relative;
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            border: 1px solid rgba(45, 212, 191, 0.22);
            background:
                linear-gradient(145deg, rgba(45, 212, 191, 0.19), rgba(56, 189, 248, 0.07)),
                var(--surface);
            box-shadow: var(--shadow-card);
            color: var(--accent);
        }

        .brand-mark::before,
        .brand-mark::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            background: currentColor;
        }

        .brand-mark::before {
            width: 17px;
            height: 2px;
        }

        .brand-mark::after {
            width: 2px;
            height: 17px;
        }

        .brand-copy {
            min-width: 0;
        }

        .eyebrow {
            margin-bottom: 2px;
            color: var(--accent);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(19px, 1.8vw, 25px);
            line-height: 1.08;
            font-weight: 760;
            letter-spacing: -0.035em;
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .datetime {
            min-width: 180px;
            padding-right: 4px;
            text-align: right;
            white-space: nowrap;
        }

        .date {
            font-size: 11px;
            font-weight: 650;
            color: var(--text);
        }

        .time {
            margin-top: 2px;
            font-size: 10px;
            color: var(--text-3);
        }

        .icon-button {
            width: 37px;
            height: 37px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--surface);
            color: var(--text-2);
            box-shadow: var(--shadow-card);
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition:
                transform 0.16s ease,
                border-color 0.16s ease,
                background-color 0.16s ease,
                color 0.16s ease;
        }

        .icon-button:hover {
            transform: translateY(-1px);
            background: var(--surface-hover);
            border-color: var(--line-strong);
            color: var(--text);
        }

        .theme-symbol {
            font-size: 16px;
            line-height: 1;
        }

        /* =========================================================
           COMMAND BAR
           ========================================================= */
        .command-bar {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) auto;
            align-items: stretch;
            gap: 9px;
            margin-bottom: 10px;
        }

        .search-wrap {
            position: relative;
            min-width: 0;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            pointer-events: none;
        }

        .search-icon svg,
        .button-icon svg {
            display: block;
            width: 15px;
            height: 15px;
        }

        .search {
            width: 100%;
            height: 40px;
            padding: 0 40px 0 38px;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                background-color 0.18s ease;
        }

        .search::placeholder {
            color: var(--text-3);
        }

        .search:hover {
            border-color: var(--line-strong);
        }

        .search:focus {
            border-color: var(--accent-2);
            box-shadow:
                0 0 0 3px var(--focus),
                var(--shadow-card);
        }

        .clear-search {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 27px;
            height: 27px;
            display: none;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text-3);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }

        .clear-search.visible {
            display: grid;
        }

        .clear-search:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .command-actions {
            display: flex;
            gap: 7px;
        }

        .command-button {
            min-height: 40px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text-2);
            box-shadow: var(--shadow-card);
            font-size: 13px; /* Tamaño de letra aumentado */
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition:
                transform 0.16s ease,
                background-color 0.16s ease,
                border-color 0.16s ease,
                color 0.16s ease;
        }

        .command-button:hover {
            transform: translateY(-1px);
            border-color: var(--line-strong);
            background: var(--surface-hover);
            color: var(--text);
        }

        .button-icon {
            color: var(--text-3);
        }

        /* =========================================================
           META
           ========================================================= */
        .portal-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 0 2px 9px;
            color: var(--text-3);
            font-size: 9.5px;
        }

        .result-count {
            color: var(--accent);
            font-weight: 750;
        }

        /* =========================================================
           CATEGORY
           ========================================================= */
        .category-section {
            --section-color: var(--accent);
            --section-rgb: 45, 212, 191;

            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
            padding: 9px 10px 10px;
            border: 1px solid rgba(var(--section-rgb), 0.16);
            border-radius: var(--radius-lg);
            background:
                linear-gradient(135deg, rgba(var(--section-rgb), 0.055), transparent 42%),
                var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .category-section::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: linear-gradient(
                180deg,
                var(--section-color),
                rgba(var(--section-rgb), 0.22)
            );
            opacity: 0.95;
        }

        .category-section[data-category="herramientas-generales"] {
            --section-color: var(--general);
            --section-rgb: var(--general-rgb);
        }

        .category-section[data-category="cosam-ceif"] {
            --section-color: var(--cosam);
            --section-rgb: var(--cosam-rgb);
        }

        .category-section[data-category="enlace-hblt"] {
            --section-color: var(--enlace);
            --section-rgb: var(--enlace-rgb);
        }

        .category-section[data-category="vida-nova"] {
            --section-color: var(--vida);
            --section-rgb: var(--vida-rgb);
        }

        .category-header {
            width: 100%;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 0 3px;
            border: 0;
            background: transparent;
            text-align: left;
            cursor: pointer;
        }

        .category-heading {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .category-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 8px;
            border-radius: 999px;
            background: var(--section-color);
            box-shadow: 0 0 0 4px rgba(var(--section-rgb), 0.10);
        }

        .category-text {
            min-width: 0;
        }

        .category-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .category-title {
            margin: 0;
            font-size: 12px;
            line-height: 1.2;
            font-weight: 760;
            letter-spacing: -0.01em;
        }

        .category-count {
            min-width: 19px;
            height: 18px;
            padding: 0 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(var(--section-rgb), 0.10);
            color: var(--section-color);
            font-size: 8px;
            font-weight: 800;
        }

        .category-subtitle {
            margin-top: 1px;
            color: var(--text-3);
            font-size: 8.5px;
        }

        .chevron {
            width: 26px;
            height: 26px;
            flex: 0 0 26px;
            display: grid;
            place-items: center;
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-3);
            transition:
                transform 0.2s ease,
                border-color 0.16s ease,
                background-color 0.16s ease,
                color 0.16s ease;
        }

        .chevron svg {
            width: 14px;
            height: 14px;
            display: block;
        }

        .category-header:hover .chevron {
            border-color: var(--line);
            background: var(--surface-soft);
            color: var(--text);
        }

        .category-header[aria-expanded="false"] .chevron {
            transform: rotate(-90deg);
        }

        /* =========================================================
           CARDS GRID
           ========================================================= */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 7px;
            padding-top: 8px;
            border-top: 1px solid var(--line);
            margin-top: 6px;
            animation: reveal 0.18s ease;
        }

        .cards-grid[hidden] {
            display: none !important;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(-3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            --card-accent: var(--section-color);
            --card-rgb: var(--section-rgb);

            position: relative;
            min-width: 0;
            min-height: 54px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background:
                linear-gradient(145deg, rgba(var(--card-rgb), 0.028), transparent 58%),
                var(--surface-solid);
            color: var(--text);
            text-decoration: none;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition:
                transform 0.16s ease,
                border-color 0.16s ease,
                background-color 0.16s ease,
                box-shadow 0.16s ease;
        }

        .card::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 0;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(var(--card-rgb), 0.32),
                transparent
            );
            opacity: 0;
            transition: opacity 0.16s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(var(--card-rgb), 0.34);
            box-shadow: var(--shadow-hover);
        }

        .card:active {
            transform: translateY(0);
        }

        .card:focus-visible {
            outline: 2px solid var(--card-accent);
            outline-offset: 2px;
        }

        .card-icon {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(var(--card-rgb), 0.12);
            border-radius: 9px;
            background: rgba(var(--card-rgb), 0.095);
            color: var(--card-accent);
            font-size: 11px;
            font-weight: 820;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .card-info {
            min-width: 0;
            flex: 1;
        }

        .card-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px; /* Tamaño de letra aumentado */
            line-height: 1.25;
            font-weight: 720;
            letter-spacing: -0.01em;
        }

        .card-arrow {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            display: grid;
            place-items: center;
            color: var(--text-3);
            opacity: 0.78;
            transition:
                transform 0.16s ease,
                color 0.16s ease,
                opacity 0.16s ease;
        }

        .card-arrow svg {
            width: 12px;
            height: 12px;
            display: block;
        }

        .card:hover .card-arrow {
            transform: translate(1px, -1px);
            color: var(--card-accent);
            opacity: 1;
        }

        /* Gmail: visual identity, without changing its function */
        .card.card-gmail {
            --card-accent: var(--gmail);
            --card-rgb: var(--gmail-rgb);
            border-color: rgba(var(--gmail-rgb), 0.33);
            background:
                linear-gradient(145deg, rgba(var(--gmail-rgb), 0.12), rgba(var(--gmail-rgb), 0.025) 56%),
                var(--surface-solid);
            box-shadow:
                0 0 0 1px rgba(var(--gmail-rgb), 0.07),
                var(--shadow-card);
        }

        .card.card-gmail .card-title {
            color: var(--gmail);
            font-weight: 800;
        }

        /* Rayen APS: visual identity, clearly different from Gmail */
        .card.card-rayen {
            --card-accent: var(--rayen);
            --card-rgb: var(--rayen-rgb);
            border-color: rgba(var(--rayen-rgb), 0.38);
            background:
                linear-gradient(145deg, rgba(var(--rayen-rgb), 0.15), rgba(var(--rayen-rgb), 0.03) 58%),
                var(--surface-solid);
            box-shadow:
                0 0 0 1px rgba(var(--rayen-rgb), 0.08),
                var(--shadow-card);
        }

        .card.card-rayen .card-title {
            color: var(--rayen);
            font-weight: 800;
        }

        .card.card-gmail .card-icon,
        .card.card-rayen .card-icon {
            background: rgba(var(--card-rgb), 0.16);
            border-color: rgba(var(--card-rgb), 0.24);
        }

        /* =========================================================
           EMPTY STATE
           ========================================================= */
        .empty-state {
            min-height: 190px;
            display: grid;
            place-items: center;
            padding: 28px;
            border: 1px dashed var(--line-strong);
            border-radius: var(--radius-lg);
            background: var(--surface);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .empty-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 9px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--surface-soft);
            color: var(--text-3);
        }

        .empty-icon svg {
            width: 18px;
            height: 18px;
        }

        .empty-title {
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 760;
        }

        .empty-description {
            max-width: 380px;
            color: var(--text-2);
            font-size: 10px;
            line-height: 1.5;
        }

        /* =========================================================
           FOOTER
           ========================================================= */
        footer {
            padding: 5px 0 1px;
            text-align: center;
            color: var(--text-3);
            font-size: 8px;
        }

        /* =========================================================
           ACCESSIBILITY
           ========================================================= */
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* =========================================================
           13" NOTEBOOK / MEDIUM DESKTOP
           Typical widths around 1280–1366 px
           ========================================================= */
        @media (max-width: 1366px) {
            .page {
                padding-top: 12px;
                padding-bottom: 14px;
            }

            .topbar {
                margin-bottom: 10px;
            }

            .cards-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .category-section {
                margin-bottom: 8px;
                padding: 8px 9px 9px;
            }

            .category-header {
                min-height: 31px;
            }

            .card {
                min-height: 50px;
                padding-top: 6px;
                padding-bottom: 6px;
            }

            .card-icon {
                width: 32px;
                height: 32px;
                flex-basis: 32px;
            }
        }

        /* =========================================================
           SMALLER LAPTOP / TABLET LANDSCAPE
           ========================================================= */
        @media (max-width: 1024px) {
            .page {
                padding-left: 14px;
                padding-right: 14px;
            }

            .cards-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .datetime {
                min-width: 155px;
            }
        }

        /* =========================================================
           TABLET / LARGE PHONE
           ========================================================= */
        @media (max-width: 760px) {
            .page {
                padding: 12px;
            }

            .topbar {
                gap: 12px;
            }

            .datetime {
                display: none;
            }

            .command-bar {
                grid-template-columns: 1fr;
            }

            .command-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .command-button {
                width: 100%;
            }

            .cards-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .portal-meta {
                margin-bottom: 8px;
            }
        }

        /* =========================================================
           PHONE
           ========================================================= */
        @media (max-width: 520px) {
            body {
                background:
                    radial-gradient(circle at 8% 0%, rgba(56, 189, 248, 0.08), transparent 20rem),
                    linear-gradient(180deg, var(--bg-2), var(--bg));
            }

            .page {
                padding:
                    max(10px, env(safe-area-inset-top))

        /* =========================================================
           HELPERS
           ========================================================= */
        function normalizarTexto(texto) {
            return String(texto)
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }

        function slugify(texto) {
            return normalizarTexto(texto)
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-|-$/g, "");
        }

        function getStoredObject(key) {
            try {
                return JSON.parse(localStorage.getItem(key)) || {};
            } catch {
                return {};
            }
        }

        function setStoredObject(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch {
                /* localStorage may be disabled */
            }
        }

        /* =========================================================
           DATE / TIME
           ========================================================= */
        function actualizarFechaHora() {
            const ahora = new Date();

            const fecha = ahora.toLocaleDateString("es-CL", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            const hora = ahora.toLocaleTimeString("es-CL", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });

            dateDisplay.textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);
            timeDisplay.textContent = hora;
        }

        actualizarFechaHora();
        setInterval(actualizarFechaHora, 30000);

        /* =========================================================
           THEME
           ========================================================= */
        function obtenerTemaPreferido() {
            try {
                const guardado = localStorage.getItem("portal-theme");
                if (guardado === "dark" || guardado === "light") {
                    return guardado;
                }
            } catch {
                /* no storage */
            }

            return window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
        }

        function aplicarTema(tema) {
            document.documentElement.dataset.theme = tema;

            const dark = tema === "dark";
            themeIcon.textContent = dark ? "☀" : "☾";
            themeButton.title = dark ? "Usar modo claro" : "Usar modo oscuro";
            themeButton.setAttribute("aria-label", themeButton.title);
        }

        aplicarTema(obtenerTemaPreferido());

        themeButton.addEventListener("click", () => {
            const actual = document.documentElement.dataset.theme;
            const nuevo = actual === "dark" ? "light" : "dark";

            aplicarTema(nuevo);

            try {
                localStorage.setItem("portal-theme", nuevo);
            } catch {
                /* no storage */
            }
        });

        /* =========================================================
           CATEGORY STATE
           ========================================================= */
        let estadoCategorias = getStoredObject("portal-category-state");

        function estadoInicialCategoria(categoria) {
            if (
                Object.prototype.hasOwnProperty.call(
                    estadoCategorias,
                    categoria
                )
            ) {
                return Boolean(estadoCategorias[categoria]);
            }

            /* Compact initial layout: the most-used general section open. */
            return categoria === "Herramientas generales";
        }

        function guardarEstadoCategorias() {
            setStoredObject("portal-category-state", estadoCategorias);
        }

        /* =========================================================
           CARD
           ========================================================= */
        function crearTarjeta(acceso) {
            const card = document.createElement("a");
            card.className = "card";
            card.href = acceso.link;
            card.target = "_blank";
            card.rel = "noopener noreferrer";
            card.title = `Abrir ${acceso.nombre}`;
            card.setAttribute(
                "aria-label",
                `${acceso.nombre}. Abrir en una nueva pestaña`
            );

            if (acceso.nombre === "Gmail") {
                card.classList.add("card-gmail");
            }

            if (acceso.nombre === "Rayen APS") {
                card.classList.add("card-rayen");
            }

            const icon = document.createElement("div");
            icon.className = "card-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = acceso.icono || "•";

            const info = document.createElement("div");
            info.className = "card-info";

            const title = document.createElement("div");
            title.className = "card-title";
            title.textContent = acceso.nombre;

            const arrow = document.createElement("div");
            arrow.className = "card-arrow";
            arrow.setAttribute("aria-hidden", "true");
            arrow.innerHTML = ICON_EXTERNAL;

            // Eliminamos la creación de la descripción (card-desc) según la petición
            info.append(title);
            card.append(icon, info, arrow);

            return card;
        }

        /* =========================================================
           CATEGORY
           ========================================================= */
        function crearCategoria(categoria, items, busquedaActiva) {
            const section = document.createElement("section");
            section.className = "category-section";
            section.dataset.category = slugify(categoria);

            const gridId = `category-${slugify(categoria)}`;

            const header = document.createElement("button");
            header.type = "button";
            header.className = "category-header";

            const abierta = busquedaActiva
                ? true
                : estadoInicialCategoria(categoria);

            header.setAttribute("aria-expanded", String(abierta));
            header.setAttribute("aria-controls", gridId);

            const heading = document.createElement("div");
            heading.className = "category-heading";

            const dot = document.createElement("span");
            dot.className = "category-dot";
            dot.setAttribute("aria-hidden", "true");

            const categoryText = document.createElement("div");
            categoryText.className = "category-text";

            const titleRow = document.createElement("div");
            titleRow.className = "category-title-row";

            const title = document.createElement("h2");
            title.className = "category-title";
            title.textContent = categoria;

            const count = document.createElement("span");
            count.className = "category-count";
            count.textContent = items.length;

            const subtitle = document.createElement("div");
            subtitle.className = "category-subtitle";
            subtitle.textContent = items.length === 1
                ? "1 acceso disponible"
                : `${items.length} accesos disponibles`;

            const chevron = document.createElement("span");
            chevron.className = "chevron";
            chevron.setAttribute("aria-hidden", "true");
            chevron.innerHTML = ICON_CHEVRON;

            titleRow.append(title, count);
            categoryText.append(titleRow, subtitle);
            heading.append(dot, categoryText);
            header.append(heading, chevron);

            const grid = document.createElement("div");
            grid.className = "cards-grid";
            grid.id = gridId;
            grid.hidden = !abierta;

            items.forEach(acceso => {
                grid.appendChild(crearTarjeta(acceso));
            });

            header.addEventListener("click", () => {
                const abiertaAhora =
                    header.getAttribute("aria-expanded") === "true";

                const nueva = !abiertaAhora;

                header.setAttribute("aria-expanded", String(nueva));
                grid.hidden = !nueva;

                if (!searchInput.value.trim()) {
                    estadoCategorias[categoria] = nueva;
                    guardarEstadoCategorias();
                }
            });

            section.append(header, grid);
            return section;
        }

        /* =========================================================
           RENDER
           ========================================================= */
        function renderizarPortal() {
            const textoBusqueda = normalizarTexto(searchInput.value);

            const filtrados = textoBusqueda
                ? accesos.filter(acceso => {
                    const textoAcceso = normalizarTexto(
                        `${acceso.nombre} ${acceso.categoria}`
                    );
                    return textoAcceso.includes(textoBusqueda);
                })
                : accesos;

            categoriesContainer.replaceChildren();

            clearSearch.classList.toggle(
                "visible",
                Boolean(textoBusqueda)
            );

            if (!filtrados.length) {
                resultCount.textContent = "0 resultados";

                const empty = document.createElement("div");
                empty.className = "empty-state";
                empty.innerHTML = `
                    <div>
                        <div class="empty-icon" aria-hidden="true">
                            ${ICON_SEARCH}
                        </div>
                        <div class="empty-title">No se encontraron accesos</div>
                        <div class="empty-description">
                            Busca por el nombre de una herramienta o una categoría,
                            por ejemplo: Drive, pacientes, COSAM, Rayen o Vida Nova.
                        </div>
                    </div>
                `;

                categoriesContainer.appendChild(empty);
                return;
            }

            resultCount.textContent = textoBusqueda
                ? (
                    filtrados.length === 1
                        ? "1 resultado"
                        : `${filtrados.length} resultados`
                )
                : `${accesos.length} accesos`;

            ordenCategorias.forEach(categoria => {
                const items = filtrados.filter(
                    acceso => acceso.categoria === categoria
                );

                if (!items.length) return;

                categoriesContainer.appendChild(
                    crearCategoria(
                        categoria,
                        items,
                        Boolean(textoBusqueda)
                    )
                );
            });
        }

        /* =========================================================
           SEARCH
           ========================================================= */
        searchInput.addEventListener("input", renderizarPortal);

        clearSearch.addEventListener("click", () => {
            searchInput.value = "";
            searchInput.focus();
            renderizarPortal();
        });

        searchInput.addEventListener("keydown", event => {
            if (event.key === "Escape" && searchInput.value) {
                searchInput.value = "";
                renderizarPortal();
            }
        });

        /* =========================================================
           EXPAND / COLLAPSE
           ========================================================= */
        function cambiarTodasLasCategorias(abiertas) {
            document
                .querySelectorAll(".category-section")
                .forEach(section => {
                    const header = section.querySelector(".category-header");
                    const grid = section.querySelector(".cards-grid");

                    header.setAttribute(
                        "aria-expanded",
                        String(abiertas)
                    );

                    grid.hidden = !abiertas;
                });

            if (!searchInput.value.trim()) {
                ordenCategorias.forEach(categoria => {
                    estadoCategorias[categoria] = abiertas;
                });
                guardarEstadoCategorias();
            }
        }

        expandAllButton.addEventListener(
            "click",
            () => cambiarTodasLasCategorias(true)
        );

        collapseAllButton.addEventListener(
            "click",
            () => cambiarTodasLasCategorias(false)
        );

        /* =========================================================
           KEYBOARD SHORTCUT
           Ctrl/Cmd + K focuses the search.
           ========================================================= */
        document.addEventListener("keydown", event => {
            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === "k"
            ) {
                event.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        });

        /* =========================================================
           START
           ========================================================= */
        renderizarPortal();
    </script>
</body>
</html>
